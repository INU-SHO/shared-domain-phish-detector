[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phish_detector"
version = "0.1.0"
description = "LLM-based phishing detector for sites hosted on shared free-website-builder domains."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Yu Inuzuka" },
]
# Versions are pinned to the set used to produce the paper's results so
# the pipeline stays reproducible. The exact resolved versions are
# captured in uv.lock; run `uv sync` to install them verbatim.
dependencies = [
    "langchain-core==0.3.80",
    "langchain-community>=0.3,<0.4",
    "langchain-openai==0.3.35",
    "langchain-deepseek==0.1.4",
    "langchain-ollama>=0.3,<0.4",
    "langgraph==0.6.3",
    "langsmith==0.4.10",
    "pydantic==2.11.7",
    "beautifulsoup4==4.13.4",
    "tldextract==5.3.0",
    "requests==2.32.5",
    "google-cloud-vision==3.11.0",
    "google-api-python-client==2.181.0",
    "selenium==4.38.0",
    "webdriver-manager==4.0.2",
    "pandas==2.3.1",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
include = ["phish_detector*"]
exclude = ["datasets*", "results*", "scripts*", "supplementary*", "configs*", "secrets*"]
